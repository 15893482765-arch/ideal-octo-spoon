[project]
name = "qinshuang-backend"
version = "0.1.0"
description = "沁爽饮料分销管理平台后端（T01 工程初始化）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9.9",
    "geoalchemy2[shapely]>=0.15",
    "redis>=5.0",
    "celery>=5.4",
    "boto3>=1.34",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    # 与服务端 qdrant/qdrant:v1.12.4 主次版本对齐（客户端警告 minor 差 >1）
    "qdrant-client>=1.12,<1.13",
]

[project.optional-dependencies]
# RAG 知识库 embedding：本地 bge-small-zh（torch CPU 版约 2GB）。
# 放可选依赖而非主依赖：生产镜像（deploy_smoke/Dockerfile）默认不装，
# 避免镜像体积暴涨；开发/摄入环境用 `pip install -e .[rag]` 启用（任务卡 2）。
rag = [
    "sentence-transformers>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "mcp", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # bugbear
]

[tool.ruff.lint.isort]
known-first-party = ["app", "mcp"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["\\.venv", "^tests/"]

[[tool.mypy.overrides]]
module = ["geoalchemy2.*", "celery.*", "boto3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "no_cache: 禁用 Redis 缓存的测试",
    "performance: 固定规格性能基准（真实 PG16）",
]
